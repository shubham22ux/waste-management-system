services:
  # ============================================================================
  # SmartWaste Express & Socket.IO Backend
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartwaste-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/smartwaste
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL:-}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      # Pass AWS Credentials from host environment or .env file:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN:-}
      - AWS_ENABLE_REKOGNITION=${AWS_ENABLE_REKOGNITION:-false}
      - JWT_SECRET=${JWT_SECRET:-smartwaste_super_secret_jwt_key_2026}
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  # ============================================================================
  # SmartWaste Client (React 19 SPA + Nginx)
  # ============================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smartwaste-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  # ============================================================================
  # MongoDB Document Database
  # ============================================================================
  mongo:
    image: mongo:7
    container_name: smartwaste-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  server_db:
  server_uploads:
